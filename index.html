<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>app</title>


<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b1020;
  font-family:Inter, Arial;
  color:white;
}


.page-title{
  text-align:center;
  font-size:42px;
  font-weight:800;
  letter-spacing:.05em;
  margin-bottom:4px;
  text-shadow:0 0 12px rgba(255,255,255,0.25),0 0 30px rgba(59,130,246,0.35);
}
.page-subtitle{
  text-align:center;
  font-size:14px;
  opacity:.7;
  margin-bottom:20px;
  letter-spacing:.08em;
}
.credit {
    text-align: center;
    margin-top: 10px;
    margin-bottom: 0px;
    font-size: 14px;
    opacity: 0.8;
}
.page-title{
  text-align:center;
  font-size:42px;
  font-weight:800;
  letter-spacing:.05em;
  margin-bottom:20px;
}
.sections{
  margin-top:600px;
  display:flex;
  flex-direction:column;
  gap:50px;
}
.container{
  display:flex;
  flex-direction:column;
  gap:50px;
  margin-top:200px;
  margin-bottom:10px;
}
.nav{
  position:fixed;
  top:0;
  width:60%;
  display:flex;
  justify-content:center;
  z-index:1000;
}
.nav-inner{
  width:1100px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 22px;
  background:rgba(11,16,32,0.55);
  backdrop-filter:blur(5px);
  border-radius:30px;
  margin-top:14px;
  box-shadow: 0 0 12px rgba(59,130,246,0.25), 0 0 60px rgba(59,130,246,0.20);
}
.logo{
  font-weight:700;
  font-size:15px;
  letter-spacing:.08em;
  opacity:.9;
}
.nav-links{
  display:flex;
  gap:22px;
}
.nav-links a{
  color:white;
  text-decoration:none;
  font-size:13px;
  opacity:.7;
  transition:.25s;
}
.nav-links a:hover{
  opacity:1;
  transform:translateY(-1px);
  text-shadow:0 0 8px rgba(255,255,255,0.6);
}
.total-board{
  display:flex;
  justify-content:center;
  gap:20px;
}
.total-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.total-box{
  width:120px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1f2937;
  border-radius:14px;
  font-size:26px;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
}

.total-box:hover{
  transform:scale(1.08);
}


.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
  text-align:center;
}

.section{
  display:flex;
  gap:16px;
  justify-content:center;
}

.item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.team{
  font-size:13px;
  opacity:.85;
}

.box{
  width:90px;
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1f2937;
  border-radius:10px;
  font-size:20px;
  font-weight:700;
  transition:.25s;
  cursor:pointer;
}

.box:hover{
  transform:scale()
}

.box:hover{
  transform:scale(1.08);
}

.stats{
  margin-top:12px;
  background:#141a2e;
  padding:10px 16px;
  border-radius:8px;
  text-align:center;
  font-size:13px;
  opacity:.85;
}

.sarah{
  background:#ef4444;
  box-shadow:0 0 18px #ef4444;
}
.jeoji{
  background:#facc15;
  color:black;
  box-shadow:0 0 18px #facc15;
}
.mulchat{
  background:#22c55e;
  box-shadow:0 0 18px #22c55e;
}
.geomun{
  background:#3b82f6;
  box-shadow:0 0 18px #3b82f6;
}
.noro{
  background:#a855f7;
  box-shadow:0 0 18px #a855f7;
}
</style>
</head>
<body>

<div class="container" id="container"></div>

<script type="module">
import { supabase } from './supabase.js'


let sections = []

  async function loadScores(){

  const { data, error } = await supabase
    .from('scores')
    .select('*')

  if(error){
    console.error(error)
    return
  }

  console.log(data)

  sections = data.map(row => ({
    title: row.game_name,

 scores: [
  Number(row.sarah_score),
  Number(row.jeoji_score),
  Number(row.mulchat_score),
  Number(row.geomun_score),
  Number(row.noro_score)
],

    stats: `Ranking: ${row.ranking}`
  }))

  buildPage()
}

loadScores()


function buildPage(){


  const teams = [
  "sarah",
  "jeoji",
  "mulchat",
  "geomun",
  "noro"
]

sections = data.map(row => ({

  title: row.game_name,

  scores: teams.map(team =>
    Number(row[`${team}_score`])
  ),

  stats: `Ranking: ${row.ranking}`

}))

const container = document.getElementById("container")
function goToHouse(index){
  window.location.href = teams[index].page
}
const totals = new Array(teams.length).fill(0)
sections.forEach(sec=>{
  sec.scores.forEach((score,i)=>{
    totals[i] += score
  })
})
const maxTotal = Math.max(...totals)
const totalBoard = document.createElement("div")
totalBoard.className = "total-board"
teams.forEach((team,i)=>{
  const item = document.createElement("div")
  item.className = "total-item"
  const name = document.createElement("div")
  name.className = "team"
  name.textContent = team.name
  const box = document.createElement("div")
  box.className = "total-box"
  box.textContent = totals[i].toFixed(1)

  if(totals[i] === maxTotal){
    box.classList.add(team.color)
  }

  box.onclick = () => goToHouse(i)
  item.appendChild(name)
  item.appendChild(box)
  totalBoard.appendChild(item)
})

const title = document.createElement("div")
title.className = "page-title"
title.textContent = "Current Standings"

container.appendChild(title)
container.appendChild(totalBoard)

sections.forEach(sectionData => {
  const wrapper = document.createElement("div")
  const title = document.createElement("div")
  title.className = "section-title"
  title.textContent = sectionData.title
  const section = document.createElement("div")
  section.className = "section"
  const max = Math.max(...sectionData.scores)
  sectionData.scores.forEach((score,i)=>{
    const item = document.createElement("div")
    item.className = "item"
    const team = document.createElement("div")
    team.className = "team"
    team.textContent = teams[i].name
    const box = document.createElement("div")
    box.className = "box"
    box.textContent = score
    if(score === max){
      box.classList.add(teams[i].color)
    }
    box.onclick = () => goToHouse(i)
    item.appendChild(team)
    item.appendChild(box)
    section.appendChild(item)

  })

  const stats = document.createElement("div")
  stats.className = "stats"
  stats.textContent = sectionData.stats
  wrapper.appendChild(title)
  wrapper.appendChild(section)
  wrapper.appendChild(stats)
  container.appendChild(wrapper)
})
}
</script>

</body>
</html>
